# Render Blueprint for the PUBLIC DEMO of Lineup Lab (docs/deployment.md).
#
# One web service (Docker) runs the FastAPI API + frozen model and serves the built React dashboard from the same
# origin: one HTTPS URL, no CORS, no cross-service URL wiring. It contains no NBA data: on first start it builds a
# SYNTHETIC league into the empty database (NBA statistics may only be used privately; see docs/refresh.md).
#
# Cost: both resources use Render's FREE plans. Free web services sleep after 15 idle minutes (~1 min to wake).
# Free Postgres expires 30 days after creation (14-day grace). The demo data is regenerated automatically, so a
# replacement free database, or an upgrade to a paid plan, needs no data migration. Do not change a plan here
# without the owner's approval.
services:
  - type: web
    name: lineup-lab
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lineup-lab-db
          property: connectionString
      - key: NBA_DEMO_MODE
        value: "1"

databases:
  - name: lineup-lab-db
    plan: free
    region: oregon
    databaseName: lineup_lab
    user: lineup_lab
    postgresMajorVersion: "17"
    ipAllowList: []          # private network only: reachable by the web service, not the internet
