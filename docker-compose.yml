# Local PostgreSQL for development. Bound to localhost only.
# Start:  docker compose up -d      Stop: docker compose stop      Wipe data: docker compose down -v
services:
  db:
    image: postgres:17.6
    container_name: nba_lineups_db
    environment:
      POSTGRES_USER: nba
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nba_lineups
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # named volume: data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nba -d nba_lineups"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
