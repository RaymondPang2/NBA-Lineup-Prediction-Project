[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-lineups"
version = "0.1.0"
description = "NBA lineup analytics and post-All-Star-break net rating prediction"
requires-python = ">=3.12"
dependencies = [
    "nba_api==1.12.0",
    "pandas==3.1.1",
    "numpy==2.5.4",
    "requests==2.34.2",
    "psycopg[binary]==3.3.8",
    "matplotlib==3.11.2",      # Phase 4: static EDA figures
    "scikit-learn==1.9.1",     # Phase 4: continuation model; Phase 6: prediction models
    "fastapi==0.163.0",        # Phase 7: REST API (brings pydantic and starlette)
    "uvicorn==0.54.0",         # Phase 7: ASGI server that runs the API
    "psycopg-pool==3.3.3",     # Phase 7: connection pool (the psycopg project's own)
    "xlsxwriter==3.3.2",       # Phase 9: Excel workbook for Power BI Service
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx2==2.16.0", "jsonschema==4.26.0", "pyyaml==6.0.4"]   # httpx2: FastAPI TestClient; jsonschema: PBIR schema tests; pyyaml: render.yaml test

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nba_lineups = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: needs a running PostgreSQL (docker compose up -d); skipped otherwise",
    "realdata: needs ingested NBA data in data/raw; skipped otherwise",
]
